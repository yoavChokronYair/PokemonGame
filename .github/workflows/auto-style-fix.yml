name: Auto Fix C# Style

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  auto-fix-style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run code style fixer
        run: |
          # Replace this with the command you use to fix code style.
          # Example for dotnet format:
          dotnet format --severity info --verify-no-changes || true

      - name: Configure git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"

      - name: Commit changes
        run: |
          git add .
          git diff-index --quiet HEAD || git commit -m "Auto fix code style"

      - name: Push changes using PAT
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git
          git push origin HEAD:${{ github.ref_name }}
